name = "lua-orchestrator"
version = "0.1.1"
wasm = "lua-orchestrator.wasm"
wasm_sha256 = "dc2a08d61d3f90f75e019cfee77b91964b6f80349a89c4f0e0079d15c6ca8bea"

# The application-specific deployment manifest must list every engine the Lua
# script may call. Empty here keeps the reusable cell least-privileged.
consumes = []
depends_on = []

provides = ["orchestrator"]

# No host capabilities are required. Lua receives no filesystem, network, OS,
# entropy, or clock authority unless a future adapter is explicitly declared.
capabilities = []

[config]
timeout_ms = 30000
script = """
pulp.on("health", function(payload)
  return {
    ok = true,
    runtime = "lua",
    application = payload and payload.application or "pulp"
  }
end)
"""
